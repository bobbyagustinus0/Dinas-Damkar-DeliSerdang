<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapor / Pengaduan | Damkar Deli Serdang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1613">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<link rel="icon" href="img/icons/icon-192.png">
</head>
<body>

<div id="site-header-placeholder"></div>

<section class="hero" style="padding:40px 0 32px;">
  <div class="container">
    <div class="eyebrow">Layanan Publik</div>
    <h1 style="font-size:clamp(1.8rem,3.4vw,2.6rem)">Sampaikan Laporan / Pengaduan</h1>
    <p class="lede">Gunakan formulir ini untuk laporan non-darurat. Untuk kejadian darurat yang sedang berlangsung, langsung hubungi 112.</p>
  </div>
</section>

<section>
  <div class="container">
    <form class="form-wrap" id="formPengaduan">
      <div class="form-row">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required>
      </div>
      <div class="form-row">
        <label for="kontak">Nomor HP / WhatsApp</label>
        <input type="tel" id="kontak" name="kontak" required>
      </div>
      <div class="form-row">
        <label for="kategori">Kategori Laporan</label>
        <select id="kategori" name="kategori">
          <option value="Kebakaran">Kebakaran</option>
          <option value="Penyelamatan / Rescue">Penyelamatan / Rescue</option>
          <option value="Sosialisasi / Edukasi">Permintaan Sosialisasi / Edukasi</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <div class="form-row">
        <label for="lokasi">Lokasi Kejadian</label>
        <input type="text" id="lokasi" name="lokasi" placeholder="Desa/Kelurahan, Kecamatan">
      </div>
      <div class="form-row">
        <label for="isi">Isi Laporan</label>
        <textarea id="isi" name="isi" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Kirim Laporan</button>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </div>
</section>

<div id="site-footer-placeholder"></div>

<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/survey.js"></script>
</body>
</html>
